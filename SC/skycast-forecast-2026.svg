<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">SkyCast forecast preview</title><desc id="desc">Seven-day forecast cards and temperature trend from the refreshed SkyCast dashboard.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111e"/><stop offset="1" stop-color="#10263d"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10243a"/><stop offset="1" stop-color="#0a1726"/></linearGradient></defs><rect width="1440" height="760" rx="28" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif" fill="#f5f9ff"><text x="78" y="76" font-size="34" font-weight="800">7-day outlook</text><text x="78" y="105" font-size="14" fill="#8fa4bb">A cleaner forecast view with native cards and a dashboard-built temperature chart.</text><g transform="translate(78 145)"><g><rect width="170" height="210" rx="22" fill="url(#card)" stroke="#29415a"/><text x="20" y="30" font-size="14" font-weight="800">Wednesday</text><text x="20" y="52" font-size="11" fill="#8fa4bb">Sep 9</text><text x="20" y="105" font-size="42">☀</text><text x="20" y="137" font-size="13">Clear</text><text x="20" y="180" font-size="28" font-weight="800">21°</text><text x="75" y="180" font-size="15" fill="#8fa4bb">13°</text></g><g transform="translate(185)"><rect width="170" height="210" rx="22" fill="url(#card)" stroke="#29415a"/><text x="20" y="30" font-size="14" font-weight="800">Thursday</text><text x="20" y="52" font-size="11" fill="#8fa4bb">Sep 10</text><text x="20" y="105" font-size="38">⛅</text><text x="20" y="137" font-size="13">Partly cloudy</text><text x="20" y="180" font-size="28" font-weight="800">19°</text><text x="75" y="180" font-size="15" fill="#8fa4bb">12°</text></g><g transform="translate(370)"><rect width="170" height="210" rx="22" fill="url(#card)" stroke="#29415a"/><text x="20" y="30" font-size="14" font-weight="800">Friday</text><text x="20" y="52" font-size="11" fill="#8fa4bb">Sep 11</text><text x="20" y="105" font-size="38">🌦</text><text x="20" y="137" font-size="13">Showers</text><text x="20" y="180" font-size="28" font-weight="800">17°</text><text x="75" y="180" font-size="15" fill="#8fa4bb">11°</text></g><g transform="translate(555)"><rect width="170" height="210" rx="22" fill="url(#card)" stroke="#29415a"/><text x="20" y="30" font-size="14" font-weight="800">Saturday</text><text x="20" y="52" font-size="11" fill="#8fa4bb">Sep 12</text><text x="20" y="105" font-size="40">☁</text><text x="20" y="137" font-size="13">Cloudy</text><text x="20" y="180" font-size="28" font-weight="800">16°</text><text x="75" y="180" font-size="15" fill="#8fa4bb">10°</text></g><g transform="translate(740)"><rect width="170" height="210" rx="22" fill="url(#card)" stroke="#29415a"/><text x="20" y="30" font-size="14" font-weight="800">Sunday</text><text x="20" y="52" font-size="11" fill="#8fa4bb">Sep 13</text><text x="20" y="105" font-size="42">☀</text><text x="20" y="137" font-size="13">Clear</text><text x="20" y="180" font-size="28" font-weight="800">20°</text><text x="75" y="180" font-size="15" fill="#8fa4bb">12°</text></g><g transform="translate(925)"><rect width="170" height="210" rx="22" fill="url(#card)" stroke="#29415a"/><text x="20" y="30" font-size="14" font-weight="800">Monday</text><text x="20" y="52" font-size="11" fill="#8fa4bb">Sep 14</text><text x="20" y="105" font-size="38">⛅</text><text x="20" y="137" font-size="13">Partly cloudy</text><text x="20" y="180" font-size="28" font-weight="800">22°</text><text x="75" y="180" font-size="15" fill="#8fa4bb">14°</text></g><g transform="translate(1110)"><rect width="170" height="210" rx="22" fill="url(#card)" stroke="#29415a"/><text x="20" y="30" font-size="14" font-weight="800">Tuesday</text><text x="20" y="52" font-size="11" fill="#8fa4bb">Sep 15</text><text x="20" y="105" font-size="42">☀</text><text x="20" y="137" font-size="13">Clear</text><text x="20" y="180" font-size="28" font-weight="800">23°</text><text x="75" y="180" font-size="15" fill="#8fa4bb">15°</text></g></g><g transform="translate(78 400)"><rect width="1280" height="292" rx="24" fill="#0b1928" stroke="#29415a"/><text x="26" y="38" font-size="23" font-weight="700">Temperature trend</text><text x="26" y="62" font-size="12" fill="#8fa4bb">High and low movement across the selected city.</text><g stroke="#29415a" stroke-opacity=".5"><line x1="70" y1="112" x2="1230" y2="112"/><line x1="70" y1="166" x2="1230" y2="166"/><line x1="70" y1="220" x2="1230" y2="220"/></g><polyline points="100,150 285,164 470,185 655,192 840,158 1025,132 1205,118" fill="none" stroke="#ffd178" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="100,220 285,228 470,236 655,244 840,226 1025,208 1205,194" fill="none" stroke="#63b6ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g fill="#ffd178"><circle cx="100" cy="150" r="6"/><circle cx="285" cy="164" r="6"/><circle cx="470" cy="185" r="6"/><circle cx="655" cy="192" r="6"/><circle cx="840" cy="158" r="6"/><circle cx="1025" cy="132" r="6"/><circle cx="1205" cy="118" r="6"/></g><g fill="#63b6ff"><circle cx="100" cy="220" r="6"/><circle cx="285" cy="228" r="6"/><circle cx="470" cy="236" r="6"/><circle cx="655" cy="244" r="6"/><circle cx="840" cy="226" r="6"/><circle cx="1025" cy="208" r="6"/><circle cx="1205" cy="194" r="6"/></g><text x="1110" y="48" font-size="11" fill="#ffd178">● High</text><text x="1180" y="48" font-size="11" fill="#63b6ff">● Low</text></g></g></svg>