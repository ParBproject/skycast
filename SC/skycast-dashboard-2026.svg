  <g transform="translate(72 720)"><rect width="882" height="132" rx="20" fill="#0c1a2a" stroke="#29415a" stroke-opacity=".55"/><text x="24" y="32" font-size="18" font-weight="700">Temperature trend</text><g stroke="#29415a" stroke-opacity=".5"><line x1="40" y1="62" x2="842" y2="62"/><line x1="40" y1="96" x2="842" y2="96"/></g><polyline points="55,78 180,85 305,96 430,101 555,82 680,68 820,60" fill="none" stroke="#ffd178" stroke-width="3"/><polyline points="55,108 180,112 305,116 430,120 555,112 680,104 820,98" fill="none" stroke="#63b6ff" stroke-width="3"/></g>
  <g transform="translate(976 720)"><rect width="392" height="132" rx="20" fill="#0c1a2a" stroke="#29415a" stroke-opacity=".55"/><text x="24" y="32" font-size="18" font-weight="700">Forecast insights</text><text x="24" y="62" font-size="11" fill="#cfe0f0">↗ Warmest day</text><text x="24" y="79" font-size="9" fill="#8fa4bb">Tuesday peaks near 23°.</text><text x="210" y="62" font-size="11" fill="#cfe0f0">☂ Wet signal</text><text x="210" y="79" font-size="9" fill="#8fa4bb">1 day leans toward showers.</text><text x="24" y="108" font-size="11" fill="#cfe0f0">◎ Clearer days</text><text x="24" y="124" font-size="9" fill="#8fa4bb">4 of 7 are clear or partly cloudy.</text></g>
