name: SkyCast quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile Python test suite
        run: python -m compileall -q tests

      - name: Run project regression checks
        run: python -m unittest discover -s tests -v

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check src/forecast-core.js
          node --check sw.js
          node --check tests/forecast-core.test.js

      - name: Run forecast core unit tests
        run: node tests/forecast-core.test.js
